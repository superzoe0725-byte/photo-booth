<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生四格</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  text-align: center;
  background: url("bg.jpg") no-repeat center center;
  background-size: cover;
}

/* 頁面切換 */
section { display: none; height: 100vh; }
section.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* 按鈕 */
.btn {
  width: 60%;
  max-width: 300px;
  margin: 20px;
}

/* 相機 */
#video {
  width: 90%;
  max-width: 400px;
  margin-top: 20px;
}

/* STEP + 翻轉 */
#stepRow {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
}

#stepImg {
  width: 30vw;
  max-width: 180px;
}

#flipBtn {
  width: 20vw;
  max-width: 120px;
}

#captureBtn {
  width: 25vw;
  max-width: 150px;
  margin-top: 20px;
}

canvas {
  width: 90%;
  margin-top: 20px;
}

/* ✨ 閃光效果 */
#flash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  pointer-events: none;
}

.flash-active {
  animation: flashAnim 0.2s;
}

@keyframes flashAnim {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>

<body>

<div id="flash"></div>

<!-- 首頁 -->
<section id="home">
  <img src="take.png" id="btnTake" class="btn">
  <img src="upload.png" id="btnUpload" class="btn">
</section>

<!-- 拍照 -->
<section id="camera">
  <div id="stepRow">
    <img id="stepImg" src="step1.png">
    <img src="flip.png" id="flipBtn">
  </div>

  <video id="video" autoplay playsinline></video>
  <img src="camera.png" id="captureBtn">

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</section>

<!-- 結果 -->
<section id="result">
  <canvas id="canvas"></canvas>
  <button id="btnDownload">Download</button>
</section>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const btnTake = document.getElementById("btnTake");
const btnUpload = document.getElementById("btnUpload");
const captureBtn = document.getElementById("captureBtn");
const flipBtn = document.getElementById("flipBtn");
const fileInput = document.getElementById("fileInput");
const stepImg = document.getElementById("stepImg");
const flash = document.getElementById("flash");

let photos = [];
let step = 0;
let facingMode = "user";
let stream = null;

/* 頁面切換 */
function showPage(id) {
  document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  location.hash = id;
}

window.onload = () => {
  showPage("home");
};

/* 相機 */
async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  video.srcObject = stream;

  video.style.transform =
    (facingMode === "user") ? "scaleX(-1)" : "scaleX(1)";
}

/* 切鏡頭 */
flipBtn.onclick = async () => {
  facingMode = (facingMode === "user") ? "environment" : "user";
  await startCamera();
};

/* 進入拍照 */
btnTake.onclick = async () => {
  photos = [];
  step = 0;
  stepImg.src = "step1.png";

  showPage("camera");
  await startCamera();
};

/* ✨ 閃光效果 */
function triggerFlash() {
  flash.classList.add("flash-active");
  setTimeout(() => {
    flash.classList.remove("flash-active");
  }, 200);
}

/* 拍照（已修正） */
captureBtn.onclick = () => {
  if (step >= 4) return;

  triggerFlash(); // ⭐️ 閃一下

  const temp = document.createElement("canvas");
  const tctx = temp.getContext("2d");

  const size = Math.min(video.videoWidth, video.videoHeight);

  temp.width = size;
  temp.height = size;

  const sx = (video.videoWidth - size) / 2;
  const sy = (video.videoHeight - size) / 2;

  if (facingMode === "user") {
    tctx.translate(size, 0);
    tctx.scale(-1, 1);
  }

  tctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);

  photos.push(temp);
  step++;

  if (step < 4) {
    stepImg.src = `step${step + 1}.png`;
  }

  if (photos.length === 4) {
    render();
  }
};

/* 上傳 */
btnUpload.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
  const files = e.target.files;

  if (files.length < 4) {
    alert("請選4張");
    return;
  }

  photos = [];
  let loaded = 0;

  for (let i = 0; i < 4; i++) {
    const img = new Image();

    img.onload = () => {
      loaded++;
      if (loaded === 4) render();
    };

    img.src = URL.createObjectURL(files[i]);
    photos.push(img);
  }
};

/* 畫照片 */
function drawPhoto(img, x, y, w, h, rotate = 0) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(rotate);

  const scale = Math.min(w / img.width, h / img.height);
  const dw = img.width * scale;
  const dh = img.height * scale;

  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

/* 合成 */
function render() {
  canvas.width = 1080;
  canvas.height = 1920;

  drawPhoto(photos[0], 55, 303, 400, 400, -0.14);
  drawPhoto(photos[1], 120, 665, 400, 400, -0.13);
  drawPhoto(photos[2], 170, 955, 400, 400, -0.14);
  drawPhoto(photos[3], 520, 345, 600, 620, 0.12);

  const frame = new Image();
  frame.src = "frame.png";

  frame.onload = () => {
    ctx.drawImage(frame, 0, 0, 1080, 1920);
    showPage("result");
  };
}

/* 下載 */
document.getElementById("btnDownload").onclick = () => {
  const link = document.createElement("a");

  // ⭐️ 檔名優化
  const now = new Date();
  const fileName = `life4_${now.getTime()}.png`;

  link.download = fileName;
  link.href = canvas.toDataURL("image/png");
  link.click();
};
</script>

</body>
</html>
