<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生四格</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  text-align: center;
  background: url("bg.jpg") no-repeat center center;
  background-size: cover;
}

/* 頁面切換 */
section { display: none; height: 100vh; }
section.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* 按鈕 */
.btn {
  width: 60%;
  max-width: 300px;
  margin: 20px;
}

/* 相機 */
#video {
  width: 90%;
  max-width: 400px;
  margin-top: 20px;
}

/* STEP + 翻轉 */
#stepRow {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
}

#stepImg {
  width: 30vw;
  max-width: 180px;
}

#flipBtn {
  width: 20vw;
  max-width: 120px;
}

#captureBtn {
  width: 25vw;
  max-width: 150px;
  margin-top: 20px;
}

canvas {
  width: 90%;
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- 首頁 -->
<section id="home">
  <img src="take.png" id="btnTake" class="btn">
  <img src="upload.png" id="btnUpload" class="btn">
</section>

<!-- 拍照 -->
<section id="camera">
  <div id="stepRow">
    <img id="stepImg" src="step1.png">
    <img src="flip.png" id="flipBtn">
  </div>

  <video id="video" autoplay playsinline></video>
  <img src="camera.png" id="captureBtn">

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</section>

<!-- 結果 -->
<section id="result">
  <canvas id="canvas"></canvas>
  <button id="downloadBtn">下載</button>
</section>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const btnTake = document.getElementById("btnTake");
const btnUpload = document.getElementById("btnUpload");
const captureBtn = document.getElementById("captureBtn");
const flipBtn = document.getElementById("flipBtn");
const fileInput = document.getElementById("fileInput");
const stepImg = document.getElementById("stepImg");

let photos = [];
let step = 0;
let facingMode = "user";
let stream = null;

/* ========================
   頁面切換（修正不閃）
======================== */
function showPage(id) {
  document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  location.hash = id;
}

window.addEventListener("hashchange", () => {
  const page = location.hash.replace("#", "");
  if (page) showPage(page);
});

window.onload = () => {
  const page = location.hash.replace("#", "") || "home";
  showPage(page);
};

/* ========================
   相機
======================== */
async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  video.srcObject = stream;

  video.style.transform =
    (facingMode === "user") ? "scaleX(-1)" : "scaleX(1)";
}

/* 切鏡頭 */
flipBtn.onclick = async () => {
  facingMode = (facingMode === "user") ? "environment" : "user";
  await startCamera();
};

/* 進入拍照 */
btnTake.onclick = async () => {
  photos = [];
  step = 0;
  stepImg.src = "step1.png";

  showPage("camera");
  await startCamera();
};

/* 拍照 */
captureBtn.onclick = () => {
  if (step >= 4) return;

  const temp = document.createElement("canvas");
  temp.width = video.videoWidth;
  temp.height = video.videoHeight;

  const tctx = temp.getContext("2d");

  if (facingMode === "user") {
    tctx.translate(temp.width, 0);
    tctx.scale(-1, 1);
  }

  tctx.drawImage(video, 0, 0);
  photos.push(temp);

  step++;

  if (step < 4) {
    stepImg.src = `step${step + 1}.png`;
  }

  if (photos.length === 4) {
    render();
  }
};

/* ========================
   上傳（修正重點🔥）
======================== */
btnUpload.onclick = () => {
  fileInput.click();
};

fileInput.onchange = (e) => {
  const files = e.target.files;

  if (files.length < 4) {
    alert("請選4張");
    return;
  }

  photos = [];
  let loaded = 0;

  for (let i = 0; i < 4; i++) {
    const img = new Image();

    img.onload = () => {
      loaded++;
      if (loaded === 4) {
        render(); // ✅ 全部載入才畫
      }
    };

    img.src = URL.createObjectURL(files[i]);
    photos.push(img);
  }
};

/* ========================
   畫照片（你的原邏輯）
======================== */
function drawPhoto(img, x, y, w, h, rotate = 0) {
  ctx.save();

  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(rotate);

  const scale = Math.min(w / img.width, h / img.height);
  const dw = img.width * scale;
  const dh = img.height * scale;

  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);

  ctx.restore();
}

/* ========================
   合成
======================== */
function render() {
  canvas.width = 1080;
  canvas.height = 1920;

  // 左三格
  drawPhoto(photos[0], 55, 303, 400, 400, -0.14);
  drawPhoto(photos[1], 120, 665, 360, 300, -0.13);
  drawPhoto(photos[2], 170, 955, 365, 300, -0.14);

  // 右大格
  drawPhoto(photos[3], 520, 345, 600, 620, 0.12);

  // 外框
  const frame = new Image();
  frame.src = "frame.png";

  frame.onload = () => {
    ctx.drawImage(frame, 0, 0, 1080, 1920);
    showPage("result");
  };
}

/* ========================
   下載
======================== */
document.getElementById("downloadBtn").onclick = () => {
  const link = document.createElement("a");
  link.download = "photo.png";
  link.href = canvas.toDataURL();
  link.click();
};
</script>

</body>
</html>
